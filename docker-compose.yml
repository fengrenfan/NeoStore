name: neostore

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neostore
      POSTGRES_PASSWORD: neostore
      POSTGRES_DB: neostore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neostore -d neostore"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://neostore:neostore@db:5432/neostore
      REDIS_URL: redis://redis:6379/0
      # Demo-only stand-in for a payment gateway's callback: it lets anyone mark
      # any order paid. Drop this line (the default is off unless set) or set it
      # to "false" the moment a real provider is wired up.
      ENABLE_MOCK_PAYMENTS: "true"
    # `app.seed` is safe to re-run — it upserts — so bootstrapping on every
    # start is fine. Don't invent a guard flag for it: an unrecognised argument
    # makes argparse exit non-zero and the container never comes up.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://neostore:neostore@db:5432/neostore
      REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  storefront:
    build:
      context: ./storefront
      args:
        # Baked into the client bundle at build time, so it has to be a URL the
        # *browser* can reach — hence the published port, not the service name.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      # Server components talk to the API over the compose network instead of
      # looping out through Caddy.
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build: ./admin
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - storefront
      - admin
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
