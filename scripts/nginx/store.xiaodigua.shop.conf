# NeoStore - store.xiaodigua.shop
# 80 仅做 ACME 验证 + 跳转 443；443 反代到 Caddy 容器（127.0.0.1:8091）
# Caddy 内部再按路径分流：/api/* -> api:8000, /admin/* -> admin:80, / -> storefront:3000

# ---------- HTTP：ACME 验证 + 301 跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name store.xiaodigua.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：反代 Caddy（统一入口）----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name store.xiaodigua.shop;

    # SSL 证书 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/store.xiaodigua.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.xiaodigua.shop/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 50m;

    # 反代到 Caddy 容器（容器内 :80 -> 宿主 8091）
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
