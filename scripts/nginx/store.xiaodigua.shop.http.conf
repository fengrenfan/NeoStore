# NeoStore - store.xiaodigua.shop (TEMP HTTP-only, for ACME issuance)
# 80 仅做 ACME 验证 + 跳转 443；443 块在证书签发后由完整配置写入

server {
    listen 80;
    listen [::]:80;
    server_name store.xiaodigua.shop;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
