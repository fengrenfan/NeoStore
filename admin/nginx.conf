# Serves the admin SPA. Requests arrive with the `/admin` prefix intact —
# Caddy uses `handle`, not `handle_path`, so nothing is stripped on the way in.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames: safe to cache forever, and the hash is what busts them.
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy leaves clients asking for
    # assets that no longer exist.
    location = /admin/index.html {
        add_header Cache-Control "no-store";
    }

    location = /admin {
        return 301 /admin/;
    }

    # Client-side routing: every unknown path under /admin falls back to the shell.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
